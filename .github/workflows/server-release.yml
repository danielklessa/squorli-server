# Server release: for a tag `v<version>` a DRAFT GitHub release whose text is apps/server/release-notes/<version>.md (written
# with the `server-release` skill) plus a standing text about updating. The image itself is built by ci.yml (job `image` on
# tags `v*`: ghcr.io/<repo>:v<version> and latest); this workflow only writes the release. Publishing the draft is a person's
# step. Tags `desktop-v*` belong to the desktop app (desktop-release.yml); the two never overlap.
name: Server release

on:
  push:
    tags: ["v*"]
  # By hand for an existing tag: writes or refreshes its draft (e.g. after the notes were fixed on a new commit of the same tag).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag v<version>
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The tag matches the server's version
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          if [ "v$version" != "$TAG" ]; then echo "::error::Tag $TAG does not match apps/server/package.json ($version)"; exit 1; fi
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          notes="apps/server/release-notes/$version.md"
          image="ghcr.io/${{ github.repository }}:$TAG"
          footer="Image: \`$image\` (also \`:latest\`). Update an installation made with the install script: \`squorli backup\`, then \`squorli update\`; with Compose by hand: set \`APP_IMAGE=$image\` in \`.env\`, then \`docker compose pull\` and \`up -d\`. Database migrations run by themselves at the start and cannot be undone: back up first. Guide: https://squorli.com/en/docs/install/"
          if [ -f "$notes" ]; then { cat "$notes"; echo; echo "---"; echo; echo "$footer"; } > body.md; else echo "$footer" > body.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A run repeated for the same tag brings the notes up to date, but never rewrites a release a person has published.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then gh release edit "$TAG" --notes-file body.md; fi
          else
            gh release create "$TAG" --draft --verify-tag --title "Squorli Server $version" --notes-file body.md
          fi
